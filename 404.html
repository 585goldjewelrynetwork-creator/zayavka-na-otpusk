<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Файл не найден · Ромашка HR-портал</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto:wght@400;500;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
:root{ --red:#F42C24; --cream:#F4EFE6; --black:#111; --white:#fff; --grey:#8a8580; }
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:Roboto,Arial,sans-serif; color:var(--black); background:var(--cream); min-height:100vh}
.top{display:flex; align-items:center; gap:10px; padding:14px 24px; background:var(--black); color:var(--white)}
.logo{display:flex; align-items:center; gap:10px; text-decoration:none; color:inherit}
.logo-mark{background:var(--red); color:var(--white); font-family:Oswald,'Arial Narrow',sans-serif; font-weight:700; font-size:22px; padding:2px 10px; transform:rotate(-3deg)}
.logo-sub{font-size:14px; color:#cfcac2}
.wrap{max-width:720px; margin:0 auto; padding:60px 20px}
.code{font-family:Oswald,'Arial Narrow',sans-serif; font-weight:700; font-size:96px; color:var(--red); line-height:1}
h1{font-family:Oswald,'Arial Narrow',sans-serif; text-transform:uppercase; font-size:34px; margin:10px 0 16px}
p{font-size:17px; line-height:1.5; margin:0 0 12px}
.btn{display:inline-block; margin-top:14px; background:var(--black); color:var(--white); text-decoration:none; font-family:Oswald,'Arial Narrow',sans-serif; text-transform:uppercase; font-size:18px; padding:12px 22px}
.note{font-size:12px; color:var(--grey); text-align:center; padding:18px}
</style>
</head>
<body>
<header class="top">
  <a class="logo" href="/zayavka-na-otpusk/"><span class="logo-mark">РОМАШКА</span><span class="logo-sub">HR-портал</span></a>
</header>
<main class="wrap">
  <div class="code">404</div>
  <h1>Файл не найден</h1>
  <p>Запрашиваемый документ не существует или был перемещён.</p>
  <p>Если ссылка взята из правил или инструкции, сообщите в HR-службу.</p>
  <a class="btn" href="/zayavka-na-otpusk/">На главную портала</a>
</main>
<div class="note">Учебный тренажёр. Компания «Ромашка» и все люди вымышлены.</div>
</body>
</html>
